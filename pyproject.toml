[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-vigilance-feux"
version = "0.1.0"
description = "Prediction IA de la vigilance feux de foret par departement francais"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "shap>=0.46",
]
geospatial = [
    "geopandas>=1.0",
    "xarray>=2024.7",
    "cfgrib>=0.9.14",
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
ia-feux = "ia_vigilance_feux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
